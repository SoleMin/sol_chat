# 웹 서버 / 외부 공개 설정. 접속 비밀번호 자체는 .env 의 ACCESS_CODE 에 둡니다.

# true면 ACCESS_CODE 가 비어 있을 때 서버가 시작되지 않습니다 (외부 공개 시 필수).
require_access_code: true

# 같은 IP에서 1분 동안 보낼 수 있는 채팅 메시지 수 (API 크레딧 보호)
rate_limit_per_minute: 30

# 같은 IP에서 1분 동안 보낼 수 있는 전체 API 요청 수 (대화 목록 조회 등 포함)
api_rate_limit_per_minute: 120

# 같은 IP에서 1분 동안 허용하는 비밀번호 실패 횟수 (넘으면 잠시 차단)
auth_fail_limit_per_minute: 10

# 메시지 한 개의 최대 글자 수
max_message_chars: 2000

# 메모리에 보관하는 대화 세션 제한
sessions:
  max_per_client: 30        # 브라우저(클라이언트) 하나당 대화 수
  max_total: 500            # 서버 전체 대화 수
  ttl_minutes: 1440         # 이 시간 동안 사용이 없으면 삭제 (24시간)
  max_turns_per_session: 100  # 대화 하나에 보관하는 최대 턴 수 (넘으면 오래된 턴부터 삭제)
